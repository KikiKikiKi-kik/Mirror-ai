<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mirror</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
<div class="sidebar-header">
  <div class="brand">
    <span class="brand-mark">M</span>
    <span>Mirror</span>
  </div>
  <button id="closeMenu" class="close-menu" type="button">×</button>
</div>
<div class="sidebar-actions">
  <button id="newChat" class="new-chat" type="button">
    <span>＋</span>
    <span>Новый чат</span>
  </button>
  <button id="codeMode" class="code-mode" type="button">
    <span>&lt;/&gt;</span>
    <span>Mirror Code</span>
  </button>
</div>
<div class="history">
  <div class="history-title">Сегодня</div>
  <div id="historyList"></div>
</div>
<div class="sidebar-bottom">
  <button id="exitButton" class="exit-button" type="button">
    ↪ Закрыть меню
  </button>
</div>
  </aside>
  <main class="main">
<header class="topbar">
  <button id="mobileMenu" class="mobile-menu" type="button">☰</button>
  <span class="mobile-title">Mirror</span>
</header>
<section class="chat">
  <div id="messages" class="messages"></div>
  <div class="composer-area">
    <div id="modeIndicator" class="mode-indicator">
      <span>&lt;/&gt;</span>
      <span>Mirror Code</span>
    </div>
    <div id="imagePreview" class="image-preview">
      <img id="previewImage" alt="Предпросмотр">
      <button id="removeImage" class="remove-image" type="button">
        ×
      </button>
    </div>
    <div class="composer">
      <button
        id="imageButton"
        class="image-button"
        type="button"
        aria-label="Добавить изображение"
      >
        🖼️
      </button>
      <input
        id="imageInput"
        type="file"
        accept="image/png,image/jpeg,image/webp,image/heic,image/heif"
        hidden
      >
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Сообщение Mirror"
        autocomplete="off"
      ></textarea>
      <button
        id="sendButton"
        class="send-button"
        type="button"
        aria-label="Отправить"
      >
        ↑
      </button>
    </div>
    <div class="disclaimer">
      Mirror может ошибаться. Проверяйте важную информацию.
    </div>
  </div>
</section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
