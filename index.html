<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Mirror</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="brand">
          <span class="brand-mark">M</span>
          <span>Mirror</span>
        </div>

        <button
          id="closeMenu"
          class="close-menu"
          type="button"
        >
          ×
        </button>

      </div>

      <div class="sidebar-top">

        <button
          id="newChat"
          class="new-chat"
          type="button"
        >
          <span>＋</span>
          <span>Новый чат</span>
        </button>

        <button
          id="imageMode"
          class="image-mode"
          type="button"
        >
          <span>🖼️</span>
          <span>Создать изображение</span>
        </button>

      </div>

      <div class="history">

        <div class="history-title">
          Сегодня
        </div>

        <div id="historyList"></div>

      </div>

      <div class="sidebar-bottom">

        <button
          id="exitButton"
          class="exit-button"
          type="button"
        >
          <span>↪</span>
          <span>Закрыть меню</span>
        </button>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <button
          id="mobileMenu"
          class="mobile-menu"
          type="button"
        >
          ☰
        </button>

        <span class="mobile-title">
          Mirror
        </span>

      </header>


      <section class="chat">

        <div
          id="messages"
          class="messages"
        >

          <div
            id="welcome"
            class="welcome"
          >

            <div class="welcome-mark">
              M
            </div>

            <h1>
              Чем могу помочь?
            </h1>

            <p>
              Напиши сообщение или создай изображение
            </p>

          </div>

        </div>


        <div class="composer-area">

          <div
            id="imagePanel"
            class="image-panel"
          >

            <div class="image-panel-title">
              🖼️ Создать изображение
            </div>

            <div class="image-options">

              <button
                class="aspect active"
                data-ratio="1:1"
                type="button"
              >
                1:1
              </button>

              <button
                class="aspect"
                data-ratio="16:9"
                type="button"
              >
                16:9
              </button>

              <button
                class="aspect"
                data-ratio="9:16"
                type="button"
              >
                9:16
              </button>

            </div>

          </div>


          <div class="composer">

            <textarea
              id="messageInput"
              rows="1"
              placeholder="Сообщение Mirror"
              autocomplete="off"
              spellcheck="true"
            ></textarea>

            <button
              id="sendButton"
              class="send-button"
              type="button"
            >
              ↑
            </button>

          </div>


          <p class="disclaimer">
            Mirror может ошибаться. Проверяйте важную информацию.
          </p>

        </div>

      </section>

    </main>

  </div>


  <script src="app.js"></script>

</body>
</html>
