<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
<div class="sidebar-header">
  <div class="brand">
    <span class="brand-mark">M</span>
    <span>Mirror</span>
  </div>
  <button id="closeMenu" class="close-menu">×</button>
</div>
<button id="newChat" class="new-chat">
  ＋ Новый чат
</button>
<button id="codeMode" class="code-mode">
  &lt;/&gt; Mirror Code
</button>
<div class="history">
  <div class="history-title">Сегодня</div>
  <div id="historyList"></div>
</div>
<button id="exitButton" class="exit-button">
  ↪ Закрыть меню
</button>
  </aside>
  <main class="main">
<header class="topbar">
  <button id="mobileMenu" class="mobile-menu">
    ☰
  </button>
  <span class="mobile-title">Mirror</span>
</header>
<div id="messages" class="messages">
  <div class="welcome">
    <div class="welcome-mark">M</div>
    <h1>Чем могу помочь?</h1>
    <p>Напиши сообщение Mirror</p>
  </div>
</div>
<div class="composer-area">
  <div id="modeIndicator" class="mode-indicator">
    &lt;/&gt; Mirror Code
  </div>
  <div id="imagePreview" class="image-preview">
    <img
      id="previewImage"
      alt="Предпросмотр"
    >
    <button
      id="removeImage"
      class="remove-image"
    >
      ×
    </button>
  </div>
  <div class="composer">
    <button
      id="imageButton"
      class="image-button"
      type="button"
    >
      🖼️
    </button>
    <input
      id="imageInput"
      type="file"
      accept="image/*"
      hidden
    >
    <textarea
      id="messageInput"
      rows="1"
      placeholder="Сообщение Mirror"
    ></textarea>
    <button
      id="sendButton"
      class="send-button"
      type="button"
    >
      ↑
    </button>
  </div>
  <div class="disclaimer">
    Mirror может ошибаться. Проверяйте важную информацию.
  </div>
</div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
