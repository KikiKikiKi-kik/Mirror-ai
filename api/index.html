<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mirror</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #25252d;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 18px;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.5;
    }

    .user {
      background: #25252d;
    }

    .mirror {
      background: #15151b;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #25252d;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #33333d;
      background: #17171d;
      color: white;
      outline: none;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>Mirror</header>

<div id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Напишите сообщение..." />
  <button onclick="sendMessage()">➤</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML += `
    <div class="message user">
      ${message}
    </div>
  `;

  input.value = "";

  const loading = document.createElement("div");
  loading.className = "message mirror";
  loading.textContent = "Mirror думает...";
  chat.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    loading.textContent = data.answer || "Произошла ошибка.";

  } catch (error) {
    loading.textContent = "Не удалось подключиться к Mirror.";
  }

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
